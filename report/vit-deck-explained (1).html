<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViT Deck, Explained</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1d2733;--muted:#5d6b7a;--line:#d9dee4;--frozen:#94a3b4;--frozenFill:#eef1f5;--train:#e46c1e;--trainFill:#fde6d6;--good:#14866d;--goodFill:#d9f1ea;--bad:#c23b3b;--badFill:#f8dede;--cA:#3a6fd8;--cB:#8b5cf6;--cC:#0e9f7a;--cD:#d9468f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(247,245,240,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1140px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:2px solid}
.sw.t{background:var(--trainFill);border-color:var(--train)}
.sw.f{background:var(--frozenFill);border-color:var(--frozen)}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--train);width:0;transition:width .4s}
main{max-width:1140px;margin:0 auto;padding:22px 20px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:#e6eaef;color:#33414f;font-weight:600}
.chip.task{background:#dfe9fb;color:#24498f}
.chip.tune{background:var(--trainFill);color:#8a3a07}
.chip.tune.none{background:var(--goodFill);color:#0c5a49}
h2{font-size:26px;line-height:1.25;margin:6px 0 16px}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:880px){.grid{grid-template-columns:1fr}h2{font-size:22px}}
.viz{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.viz svg{width:100%;height:auto;display:block}
.text{font-size:15.5px}
.text h3{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.text h3:first-child{margin-top:0}
.text p{margin:0 0 8px}
.text ul{margin:0 0 8px;padding-left:20px}
.take{background:var(--card);border-left:4px solid var(--train);padding:10px 14px;border-radius:8px;margin-top:14px}
nav{display:flex;align-items:center;gap:10px;justify-content:center;padding:22px 20px 34px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px}
button:hover{border-color:#a9b3bf}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.dots button{width:12px;height:12px;padding:0;border-radius:50%;background:#cfd5dc;border:0}
.dots button.on{background:var(--train)}
.ctrl{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.ctrl button{font-size:13.5px;padding:6px 11px}
.ctrl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.info{font-size:14.5px;margin-top:8px;min-height:48px;padding:8px 12px;background:#f6f7f9;border-radius:8px}
svg text{font-family:inherit}
.lbl{font-size:13px;fill:var(--ink)}
.sm{font-size:11.5px;fill:var(--muted)}
.xs{font-size:10.5px;fill:var(--muted)}
.bold{font-weight:700}
.ttl{font-size:14.5px;font-weight:700;fill:var(--ink)}
.num{font-size:13.5px;font-weight:700;fill:var(--ink)}
.big{font-size:22px;font-weight:800;fill:var(--ink)}
.fz{fill:var(--frozenFill);stroke:var(--frozen);stroke-width:1.5}
.tr{fill:var(--trainFill);stroke:var(--train);stroke-width:2}
.nb{fill:#e3e8ee;stroke:#9aa7b5;stroke-width:1.2}
.card{fill:#fff;stroke:var(--line);stroke-width:1.2}
.part{transition:fill .5s,stroke .5s;fill:var(--frozenFill);stroke:var(--frozen);stroke-width:1.5}
.part.on{fill:var(--trainFill);stroke:var(--train);stroke-width:2}
.addon{transition:opacity .5s;opacity:0}
.addon.on{opacity:1}
.ax{stroke:#b9c2cc;stroke-width:1}
.flow{stroke:#8795a4;stroke-width:1.5;fill:none}
.lbar{transform-box:fill-box;transform-origin:center bottom;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes aim{0%,25%{transform:translate(0px,0px)}100%{transform:translate(31px,25px)}}
@keyframes swapUp{0%,40%{transform:translateY(0px)}100%{transform:translateY(-44px)}}
@keyframes swapDown{0%,40%{transform:translateY(0px)}100%{transform:translateY(44px)}}
.a{animation:fadeUp .6s ease both;animation-delay:var(--d,0s)}
.fi{animation:fadeIn .7s ease both;animation-delay:var(--d,0s)}
.gx{transform-box:fill-box;transform-origin:left center;animation:growX .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.gy{transform-box:fill-box;transform-origin:center bottom;animation:growY .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease both;animation-delay:var(--d,0s)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards;animation-delay:var(--d,0s)}
.pulse{animation:pulse 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.aim{animation:aim 2.2s ease-in-out both;animation-delay:var(--d,0s)}
.swapUp{animation:swapUp 1.8s ease-in-out both;animation-delay:var(--d,0s)}
.swapDown{animation:swapDown 1.8s ease-in-out both;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1>Team 08 · The ViT deck, explained visually</h1>
    <div class="legend"><span><i class="sw t"></i>being trained</span><span><i class="sw f"></i>frozen (not changed)</span><span>← → keys to move</span></div>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>
<main id="stage"></main>
<nav>
  <button id="prev">← Back</button>
  <div class="dots" id="dots"></div>
  <button id="replay" title="Replay the animation">↻ Replay</button>
  <button id="next" class="primary">Next →</button>
</nav>

<script>
/* ---------- helpers ---------- */
const DEFS = `<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8795a4"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e46c1e"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14866d"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c23b3b"/></marker>
</defs>`;
const svg = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${DEFS}${inner}</svg>`;
const st = o => { let s = `--d:${o.d || 0}s;`; if (o.fill) s += `fill:${o.fill};`; if (o.stroke) s += `stroke:${o.stroke};`; if (o.sw) s += `stroke-width:${o.sw};`; if (o.op != null) s += `opacity:${o.op};`; if (o.dash) s += `stroke-dasharray:${o.dash};`; return `style="${s}"`; };
const T = (x, y, s, o = {}) => `<text ${o.id ? `id="${o.id}"` : ''} x="${x}" y="${y}" class="${o.c || 'lbl'} ${o.an || ''}" ${o.a ? `text-anchor="${o.a}"` : ''} ${st(o)}>${s}</text>`;
const R = (x, y, w, h, o = {}) => `<rect ${o.id ? `id="${o.id}"` : ''} x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 8}" class="${o.c || ''} ${o.an || ''}" ${st(o)}/>`;
const P = (d, o = {}) => `<path d="${d}" ${o.anim !== false ? 'pathLength="1"' : ''} class="${o.c || 'flow'} ${o.an || ''}" ${o.m ? `marker-end="url(#${o.m})"` : ''} ${st(o)}/>`;
const C = (x, y, r, o = {}) => `<circle ${o.id ? `id="${o.id}"` : ''} cx="${x}" cy="${y}" r="${r}" class="${o.c || ''} ${o.an || ''}" ${st(o)}/>`;
const G = (inner, o = {}) => `<g ${o.id ? `id="${o.id}"` : ''} class="${o.c || ''} ${o.an || ''}" ${st(o)}>${inner}</g>`;

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function cl(cx, cy, n, sx, sy, seed) { const r = rng(seed), p = []; for (let i = 0; i < n; i++) { const u = Math.max(r(), 1e-6), v = r(), m = Math.min(Math.sqrt(-2 * Math.log(u)), 2.2); p.push([cx + sx * m * Math.cos(6.2832 * v), cy + sy * m * Math.sin(6.2832 * v)]); } return p; }
const mean = p => [p.reduce((s, q) => s + q[0], 0) / p.length, p.reduce((s, q) => s + q[1], 0) / p.length];
const dots = (p, col, d0 = 0, r = 3.4, step = .012) => p.map((q, i) => `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${r}" class="pop" style="fill:${col};--d:${(d0 + i * step).toFixed(3)}s"/>`).join('');
const star = (x, y, col, d = 0, s = 1) => { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = (i % 2 ? 5 : 11) * s; pts.push((x + rr * Math.cos(a)).toFixed(1) + ',' + (y + rr * Math.sin(a)).toFixed(1)); } return `<polygon points="${pts.join(' ')}" class="pop" style="fill:${col};stroke:#fff;stroke-width:1.5;--d:${d}s"/>`; };
const ring = (x, y, col, d = 0) => `<circle cx="${x}" cy="${y}" r="8" class="pop" style="fill:#fff;stroke:${col};stroke-width:3;--d:${d}s"/>`;
const bird = (cx, cy, s = 1, col = '#5b6b7b', flip = false) => `<g transform="translate(${cx} ${cy}) scale(${flip ? -s : s} ${s})"><ellipse cx="0" cy="0" rx="16" ry="10" fill="${col}"/><circle cx="13" cy="-8" r="6.5" fill="${col}"/><polygon points="19,-9 26,-7 19,-5" fill="#e0a83a"/><circle cx="15" cy="-9.5" r="1.4" fill="#fff"/><polygon points="-14,-2 -27,-8 -25,4" fill="${col}"/><line x1="-2" y1="9" x2="-3" y2="15" stroke="${col}" stroke-width="1.6"/><line x1="4" y1="9" x2="5" y2="15" stroke="${col}" stroke-width="1.6"/></g>`;
const strip = (x, y, trainedBlocks, head, d = 0) => { let s = ''; for (let i = 0; i < 12; i++) s += R(x + i * 13, y, 10, 22, { rx: 2, c: trainedBlocks ? 'tr' : 'fz', an: 'pop', d: d + i * .02 }); s += R(x + 160, y, 16, 22, { rx: 3, c: head ? 'tr' : 'fz', an: 'pop', d: d + .26 }); return s; };

let timer = null;
const later = (fn, ms) => { const id = setTimeout(fn, ms); (window._timeouts = window._timeouts || []).push(id); };

/* ---------- scenes ---------- */
const scenes = [];

/* 0. Big picture */
scenes.push({
  slides: 'Whole deck', task: 'The big picture', tune: 'Three different things', title: 'One model, three ways to make it better',
  viz() {
    let s = '';
    s += R(16, 70, 110, 110, { c: 'card', an: 'a', fill: '#e9efe6' });
    s += G(`<line x1="24" y1="160" x2="118" y2="146" stroke="#8a6d4b" stroke-width="3"/>` + bird(76, 132, 1.05), { an: 'a', d: .1 });
    s += T(71, 200, 'Photo', { a: 'middle', c: 'sm', an: 'a', d: .1 });
    s += P('M132 125 H148', { m: 'ar', an: 'draw', d: .3 });
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) s += R(154 + c * 19, 88 + r * 19, 16, 16, { rx: 2, c: 'nb', an: 'pop', d: .4 + (r * 4 + c) * .02 });
    s += T(190, 200, 'Cut into patches', { a: 'middle', c: 'sm', an: 'a', d: .5 });
    s += P('M236 125 H254', { m: 'ar', an: 'draw', d: .7 });
    for (let i = 0; i < 12; i++) s += R(260 + i * 18, 65, 13, 120, { rx: 3, c: 'nb', an: 'pop', d: .8 + i * .05 });
    s += T(367, 200, '12 transformer blocks · 86M weights', { a: 'middle', c: 'sm', an: 'a', d: 1.2 });
    s += P('M478 125 H496', { m: 'ar', an: 'draw', d: 1.4 });
    s += R(500, 65, 52, 120, { c: 'nb', an: 'pop', d: 1.5 });
    s += T(526, 129, 'Head', { a: 'middle', an: 'a', d: 1.5 });
    s += T(526, 200, '10,000 classes', { a: 'middle', c: 'sm', an: 'a', d: 1.5 });
    s += P('M558 125 H578', { m: 'ar', an: 'draw', d: 1.7 });
    s += R(582, 90, 162, 70, { c: 'card', an: 'pop', d: 1.8 });
    s += T(663, 118, 'Prediction', { a: 'middle', c: 'sm', an: 'a', d: 1.9 });
    s += T(663, 141, 'species #4745', { a: 'middle', c: 'num', an: 'a', d: 1.9 });
    s += R(260, 230, 292, 30, { c: 'tr', an: 'gx', d: 2.3 });
    s += T(406, 250, 'Task 1 · Full fine-tuning: train all 86M', { a: 'middle', an: 'a', d: 2.5 });
    s += R(260, 268, 292, 30, { c: 'fz', an: 'gx', d: 2.9 });
    for (let i = 0; i < 12; i++) s += R(264 + i * 23.5, 291, 14, 4, { rx: 1, fill: 'var(--train)', an: 'pop', d: 3.2 + i * .03 });
    s += T(406, 287, 'Task 2 · PEFT: freeze it, add small parts', { a: 'middle', an: 'a', d: 3.1 });
    s += R(470, 306, 274, 30, { fill: 'var(--goodFill)', stroke: 'var(--good)', sw: 2, an: 'gx', d: 3.6 });
    s += T(607, 326, 'Task 3 · Smarter predicting, no training', { a: 'middle', an: 'a', d: 3.8 });
    return svg(760, 350, s, 'Pipeline from photo to prediction, with the three tasks marked');
  },
  text: `<h3>What the project is</h3><p>We take one pretrained image model (a Vision Transformer, "ViT") and teach it to tell apart <b>10,000 look-alike species</b>.</p>
  <p>The model reads a photo as small square patches, passes them through 12 identical "blocks", and a final "head" picks one of the 10,000 species.</p>
  <h3>The three tasks</h3><ul><li><b>Task 1:</b> retrain every weight (most accurate, most expensive).</li><li><b>Task 2:</b> keep the 86M weights frozen and train small add-ons instead (cheap).</li><li><b>Task 3:</b> don't train anything; just get better answers out of a trained model.</li></ul>
  <div class="take"><b>The question of the whole deck:</b> how close can the cheap option (Task 2) get to the expensive one (Task 1)?</div>`
});

/* 1. Challenge */
scenes.push({
  slides: 'Slide 2', task: 'Setting the scene', tune: 'Nothing yet', none: true, title: 'Why this is hard: look-alikes, and one species with many looks',
  viz() {
    let s = '';
    s += R(16, 16, 350, 300, { c: 'card', an: 'a' });
    s += T(32, 44, 'Different species, same look', { c: 'ttl', an: 'a' });
    const A = cl(150, 175, 40, 30, 28, 11), B = cl(222, 190, 40, 30, 28, 23);
    s += dots(A, 'var(--cA)', .3) + dots(B, 'var(--cB)', .5);
    s += T(110, 268, '● species 4745', { c: 'sm', fill: 'var(--cA)', an: 'a', d: 1.2 }) + T(205, 268, '● species 4746', { c: 'sm', fill: 'var(--cB)', an: 'a', d: 1.2 });
    s += T(191, 298, 'The two groups overlap → easy to mix up', { a: 'middle', c: 'sm', an: 'a', d: 1.4 });
    s += R(394, 16, 350, 300, { c: 'card', an: 'a', d: .1 });
    s += T(410, 44, 'Same species, different looks', { c: 'ttl', an: 'a', d: .1 });
    const C1 = cl(480, 130, 28, 20, 18, 5), C2 = cl(660, 228, 14, 16, 14, 9);
    s += dots(C1, 'var(--cC)', 1.4) + dots(C2, 'var(--cC)', 1.8);
    const m1 = mean(C1), m2 = mean(C2);
    s += P(`M${m1[0] + 28} ${m1[1] + 18} L${m2[0] - 26} ${m2[1] - 16}`, { an: 'draw', d: 2.2, dash: '4 4' });
    s += T(585, 168, 'still species 3076', { a: 'middle', c: 'sm', an: 'a', d: 2.4 });
    s += T(569, 298, 'One species, far-apart groups (pose, light…)', { a: 'middle', c: 'sm', an: 'a', d: 2.6 });
    return svg(760, 330, s, 'Two feature-space panels showing overlapping species and one species with two groups');
  },
  text: `<h3>How to read the dots</h3><p>Every dot is one photo, placed where the model "sees" it. Photos the model thinks are similar sit close together. Colour = true species.</p>
  <h3>The two problems</h3><ul><li><b>Left:</b> two species look almost the same, so their dots overlap. The difference may be a few pixels.</li><li><b>Right:</b> one species looks very different in different photos, so its dots split into separate groups.</li></ul>
  <div class="take">Remember these two pictures. At the end (Task 3), the model's mistakes turn out to be exactly these two problems.</div>`
});

/* 2. Experimental design */
scenes.push({
  slides: 'Slides 3–4', task: 'Setting the scene', tune: 'Nothing yet', none: true, title: 'Test ideas cheaply first, then confirm, then score once',
  viz() {
    let s = '';
    const box = (x, d, t1, t2, t3, col) => R(x, 30, 228, 112, { c: 'card', an: 'pop', d, stroke: col, sw: 2 }) + T(x + 114, 60, t1, { a: 'middle', c: 'ttl', an: 'a', d: d + .1 }) + T(x + 114, 88, t2, { a: 'middle', c: 'big', an: 'a', d: d + .2 }) + T(x + 114, 118, t3, { a: 'middle', c: 'sm', an: 'a', d: d + .3 });
    s += box(16, .1, '1 · Pilot', '1,000 species', 'quick 3–5 epoch tests', '#9aa7b5');
    s += P('M248 86 H262', { m: 'ar', an: 'draw', d: .6 });
    s += box(266, .7, '2 · Labelled holdout', '10,000 species', '50,000 photos with known answers', 'var(--cA)');
    s += P('M498 86 H512', { m: 'ar', an: 'draw', d: 1.2 });
    s += box(516, 1.3, '3 · CodaBench', 'hidden test', 'official scores, used sparingly', 'var(--good)');
    s += T(16, 186, 'How many ideas reach each stage', { c: 'sm', an: 'a', d: 1.8 });
    s += R(16, 198, 228, 30, { c: 'tr', an: 'gx', d: 2.0, rx: 6 });
    s += T(130, 218, 'lots of ideas', { a: 'middle', an: 'a', d: 2.2 });
    s += R(296, 198, 168, 30, { c: 'tr', an: 'gx', d: 2.4, rx: 6 });
    s += T(380, 218, 'the promising ones', { a: 'middle', an: 'a', d: 2.6 });
    s += R(586, 198, 88, 30, { c: 'tr', an: 'gx', d: 2.8, rx: 6 });
    s += T(630, 218, 'final picks', { a: 'middle', an: 'a', d: 3.0 });
    s += T(380, 272, 'Pilot scores look high (~90%) only because there are 10× fewer species to confuse.', { a: 'middle', c: 'sm', an: 'a', d: 3.3 });
    s += T(380, 292, 'So pilot numbers are only compared with other pilot numbers.', { a: 'middle', c: 'sm', an: 'a', d: 3.4 });
    return svg(760, 310, s, 'Three-stage experimental design');
  },
  text: `<h3>The three questions (slide 3)</h3><ul><li><b>Q1:</b> retrain everything, or train small add-ons — which is the better deal?</li><li><b>Q2:</b> which add-on method works best, and where should it go?</li><li><b>Q3:</b> what mistakes are left, and can we fix some without retraining?</li></ul>
  <h3>How experiments were run (slide 4)</h3><p>Ideas are first tested on a small, fast version of the problem. Only the good ones move to the full 10,000 species. Only the very best get submitted to the official leaderboard (CodaBench).</p>
  <div class="take">"Holdout" = photos we kept aside with known answers, so we can grade ideas ourselves without using up leaderboard submissions.</div>`
});

/* 3. Baseline failure */
scenes.push({
  slides: 'Slide 5', task: 'Task 1 · Full fine-tuning', tune: 'All 86M weights', title: 'First try: training everything did no better than training almost nothing',
  viz() {
    let s = '';
    const x0 = 230, W = 470, px = v => x0 + (v - 40) / 35 * W;
    s += T(16, 28, 'What trains (12 blocks + head)', { c: 'sm', an: 'a' });
    s += T(x0, 28, 'CodaBench accuracy at 224 px (axis starts at 40%)', { c: 'sm', an: 'a' });
    const rows = [
      ['Only the head (backbone frozen)', false, true, 62.5, '#9fb3c8'],
      ['Everything — first try', true, true, 61.3, '#e9a3a3'],
      ['Everything + better LR schedule', true, true, 66.3, '#9fb3c8'],

    s += T(lx, 214, 'Re-ranked: B moves to #1', { c: 'sm', fill: 'var(--good)', an: 'a', d: 6 });
    s += T(lx, 252, 'CodaBench gain', { c: 'sm', an: 'a', d: 6.2 }) + T(lx, 280, '+0.85 to +1.40 pts', { c: 'big', an: 'a', d: 6.3 });
    s += T(lx, 308, 'holdout: 1,376 fixed, 732 broken', { c: 'sm', an: 'a', d: 6.5 });
    return svg(760, 350, s, 'kNN re-ranking illustration');
  },
  text: `<h3>Why the head can be fooled</h3><p>The head judges each species by one average point (★). Species B has a rarer second look (bottom group), so B's average sits far away from those photos.</p>
  <h3>The fix</h3><ol><li>The head proposes its top 5 species.</li><li>For each, find the 3 training photos most similar to the new photo.</li><li>Blend that similarity with the head's score and re-order the 5.</li></ol>
  <p>Settings were picked on half of our holdout and checked on the other half — never tuned on CodaBench.</p>
  <div class="take">It fixes 19% of mistakes whose answer is in the top 5. It struggles most with "unseen looks" — there is no similar training photo to find.</div>`
});

/* 17. Verdict */
scenes.push({
  slides: 'Slides 22–23', task: 'Answer to Q1', tune: 'Comparing final systems', title: 'Verdict: full fine-tuning wins accuracy and speed; PEFT wins on cost to train',
  viz() {
    let s = '';
    s += T(300, 30, 'Full fine-tune', { a: 'middle', c: 'ttl' }) + T(500, 30, 'AF + LoRA (PEFT)', { a: 'middle', c: 'ttl' }) + T(680, 30, 'Better', { a: 'middle', c: 'ttl' });
    const rows = [
      ['Accuracy, plain', '82.59%', '81.20%', 'Full FT', 0],
      ['Accuracy, zoom + kNN', '84.07%', '83.08%', 'Full FT', 0],
      ['Weights trained', '100%', '4.94%', 'PEFT', 1],
      ['Training memory', '18.0', '14.7', 'PEFT', 1],
      ['Training time', '144 min', '144 min', 'same budget', 2],
      ['Speed at use (1 photo)', '7.2 ms', '12.4 ms', 'Full FT', 0]];
    rows.forEach((r, i) => {
      const y = 48 + i * 52, d = .3 + i * .4, w = r[4];
      s += R(16, y, 728, 42, { fill: i % 2 ? '#fafbfc' : '#fff', stroke: '#e6eaef', sw: 1, rx: 6, an: 'gx', d });
      s += T(30, y + 26, r[0], { c: 'lbl bold', an: 'a', d });
      s += T(300, y + 27, r[1], { a: 'middle', c: w === 0 ? 'num' : 'lbl', an: 'a', d: d + .15, fill: w === 0 ? 'var(--good)' : '' });
      s += T(500, y + 27, r[2], { a: 'middle', c: w === 1 ? 'num' : 'lbl', an: 'a', d: d + .15, fill: w === 1 ? 'var(--good)' : '' });
      s += R(624, y + 9, 112, 24, { rx: 12, fill: w === 2 ? '#e6eaef' : 'var(--goodFill)', stroke: 'none', an: 'pop', d: d + .3 }) + T(680, y + 26, r[3], { a: 'middle', c: 'sm', an: 'a', d: d + .3, fill: w === 2 ? 'var(--muted)' : 'var(--good)' });
    });
    s += T(16, 380, 'CodaBench, 448 px, both trained 144 min on one A100 40 GB (full FT 4.5 epochs, PEFT 5.5).', { c: 'sm' });
    return svg(760, 392, s, 'Scorecard comparing full fine-tuning and PEFT');
  },
  text: `<h3>Same conditions for both</h3><p>Same image size, same 144 minutes of training, same head, same zoom and kNN tricks. The tricks help both by about the same amount, so the 1.0–1.4 point gap is real.</p>
  <h3>The surprise: PEFT is slower to use</h3><p>LoRA alone can be folded into the frozen weights, so it costs nothing extra. AdaptFormer is a separate side-path that must run every time — so the final PEFT model takes <b>12.4 ms vs 7.2 ms</b> per photo.</p>
  <h3>Where PEFT does win</h3><p>It trains 20× fewer weights, needs less memory, and each new task only needs a ~4M add-on instead of a full 86M copy. It also fits 22% more images into the same 144 minutes.</p>`
});

/* 18. Conclusion */
scenes.push({
  slides: 'Slides 24–25', task: 'Conclusion', tune: 'Everything together', title: 'No single knob explains the result — four factors work together',
  viz() {
    let s = '';
    const tiles = [['Resolution', 'bigger images beat', 'more rounds', 'scene 7'], ['Optimisation', 'head start + gentle', 'early layers', 'scenes 4–6'], ['Allocation', 'a little everywhere,', 'LoRA over width', 'scenes 10–11'], ['Prediction', 'zoom + similar', 'photos, no training', 'scenes 16–17']];
    tiles.forEach((t, i) => {
      const x = 16 + i * 186, d = i * .5;
      s += R(x, 30, 166, 150, { c: 'card', an: 'pop', d, stroke: 'var(--train)', sw: 2 });
      s += T(x + 83, 70, t[0], { a: 'middle', c: 'ttl', an: 'a', d: d + .1 });
      s += T(x + 83, 100, t[1], { a: 'middle', c: 'sm', an: 'a', d: d + .2 }) + T(x + 83, 116, t[2], { a: 'middle', c: 'sm', an: 'a', d: d + .2 });
      s += T(x + 83, 160, t[3], { a: 'middle', c: 'xs', an: 'a', d: d + .3 });
      if (i < 3) s += T(x + 176, 112, '×', { a: 'middle', c: 'big', an: 'pop', d: d + .4 });
    });
    s += T(16, 214, 'What didn\u2019t work (slide 24)', { c: 'ttl', an: 'a', d: 2.2 });
    ['More rounds at low resolution', 'Packing LoRA into later blocks (no gain)', 'Judging a method by how many weights it trains', 'A flipped copy as the second look', 'Tweaking add-ons before fixing the head'].forEach((t, i) => s += T(28, 240 + i * 20, '•  ' + t, { c: 'sm', an: 'a', d: 2.4 + i * .15 }));
    return svg(760, 345, s, 'Four factors and what did not work');
  },
  text: `<h3>The deck's three recommendations</h3><ol><li><b>Count training cost and trainable weights separately.</b> Training fewer weights didn't save time per run, and didn't make the model faster to use.</li><li><b>Treat the head as part of the method.</b> How it starts moved accuracy as much as the add-ons did.</li><li><b>Test on unfamiliar looks.</b> They're wrong 60% of the time — the next problem to solve.</li></ol>
  <div class="take">One sentence to remember: <b>adapting a pretrained model is a joint design problem</b> — image size, training recipe, where the trainable parts go, and how you predict all interact.</div>`
});

/* ---------- engine ---------- */
let cur = 0;
const stage = document.getElementById('stage'), dotsEl = document.getElementById('dots');
scenes.forEach((sc, i) => { const b = document.createElement('button'); b.title = `${i + 1}. ${sc.title}`; b.setAttribute('aria-label', `Go to scene ${i + 1}`); b.onclick = () => go(i); dotsEl.appendChild(b); });
function clearTimers() { clearInterval(timer); timer = null; (window._timeouts || []).forEach(clearTimeout); window._timeouts = []; }
function render() {
  clearTimers();
  const sc = scenes[cur];
  stage.innerHTML = `<div class="meta"><span class="chip">${cur + 1} / ${scenes.length}</span><span class="chip">${sc.slides}</span><span class="chip task">${sc.task}</span><span class="chip tune ${sc.none ? 'none' : ''}">Tuning: ${sc.tune}</span></div>
  <h2>${sc.title}</h2><div class="grid"><div class="viz">${sc.viz()}</div><div class="text">${sc.text}</div></div>`;
  if (sc.mount) sc.mount();
  [...dotsEl.children].forEach((b, i) => b.classList.toggle('on', i === cur));
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === scenes.length - 1;
  document.getElementById('prog').style.width = ((cur + 1) / scenes.length * 100) + '%';
}
function go(i) { cur = Math.max(0, Math.min(scenes.length - 1, i)); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {} }
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
document.getElementById('replay').onclick = () => render();
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
const h = parseInt((location.hash || '').slice(1), 10); if (h >= 1 && h <= scenes.length) cur = h - 1;
render();
</script>
</body>
