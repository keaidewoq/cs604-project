<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ViT Adaptation Deck</title>
<style>
@font-face{font-family:"Figtree";src:url("fonts/Figtree-wght.ttf") format("truetype");font-weight:300 900;font-display:swap}
@font-face{font-family:"Literata";src:url("fonts/Literata-opsz-wght.ttf") format("truetype");font-weight:200 900;font-display:swap}
@font-face{font-family:"Archivo Narrow";src:url("fonts/ArchivoNarrow-wght.ttf") format("truetype");font-weight:400 700;font-display:swap}
:root{--bg:#182a3b;--paper:#fff;--card:#fff;--ink:#1f2937;--muted:#566573;--quiet:#d5e1ea;--line:#c8d1d8;--controlLine:#80909d;--chrome:#214d73;--surface:#f1f4f6;--surfaceCool:#e9f0f5;--grid:#e1e7eb;--flow:#758795;--frozen:#708392;--frozenFill:#e9eef2;--plotNeutral:#7e91a2;--train:#9f3131;--trainStrong:#7d2024;--trainFill:#f5dfdd;--trainWash:#f8ecea;--good:#176b5d;--goodFill:#dceee9;--bad:#a12f38;--badFill:#f4dfe1;--info:#214d73;--infoFill:#e0ebf3;--cA:#2e62a0;--cB:#674a9e;--cC:#176b5d;--cD:#a33d72;--photoFill:#edf2eb;--photoLine:#bdc8bd;--illustration:#586d7d;--earth:#79624c;--beak:#a97724;--darkRaised:#2c5b80;--darkText:#f4f8fb;--darkMuted:#c7d7e3;
--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Literata",Georgia,"Times New Roman",serif;--narrow:"Archivo Narrow","Arial Narrow",var(--sans)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;width:100%;min-width:0;background:var(--bg);color:var(--ink);font:17px/1.48 var(--sans);overflow:hidden;font-synthesis:none}
#deck{position:fixed;left:50%;top:50%;width:1600px;height:900px;background:var(--paper);transform-origin:center center;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
::selection{background:var(--trainFill);color:var(--ink)}
button:focus-visible{outline:3px solid var(--train);outline-offset:3px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
/* ---------- chrome ---------- */
.top{position:absolute;left:0;right:0;top:0;height:66px;display:flex;align-items:center;gap:28px;padding:0 64px;border-bottom:0;background:var(--chrome)}
.brand{font:700 15px var(--narrow);letter-spacing:.09em;text-transform:uppercase;color:#fff;white-space:nowrap}
.track{flex:1;display:flex;gap:10px}
.seg{flex:1;min-width:0}
.seg span{display:block;font:600 14px var(--narrow);letter-spacing:.05em;text-transform:uppercase;color:#bad0df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s}
.seg i{display:block;height:3px;border-radius:0;background:#527594;margin-top:6px;overflow:hidden}
.seg i b{display:block;height:100%;width:0;background:var(--muted);transition:width .6s cubic-bezier(.2,.8,.2,1),background .4s}
.seg.done span{color:#e4edf3}
.seg.cur span{color:#fff}
.seg.cur i b{background:var(--train)}
.count{font:600 16px var(--narrow);color:#fff;letter-spacing:.05em;white-space:nowrap;min-width:70px;text-align:right;font-variant-numeric:tabular-nums lining-nums}
.foot{position:absolute;left:0;right:0;bottom:0;height:50px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 64px;border-top:1px solid var(--line);background:#fff;font-size:15px;color:var(--muted)}
.foot .src{font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.foot .src b{font-style:normal;font-weight:600;color:var(--ink)}
.foot .r{white-space:nowrap;font:600 14px var(--narrow);letter-spacing:.08em;text-transform:uppercase}
#deck.is-title .top,#deck.is-title .foot{display:none}
#slide{position:absolute;left:0;right:0;top:66px;bottom:50px;padding:26px 64px 20px;display:flex;flex-direction:column}
#deck.is-title #slide{top:0;bottom:0;padding:0}
#slide.enter{animation:slideIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
/* ---------- content slide ---------- */
.slideMeta{font:700 15px var(--narrow);letter-spacing:.1em;text-transform:uppercase;color:var(--train);border-top:1px solid var(--line);padding-top:8px;margin:-8px 0 14px}
h1,h2,.secT{font-optical-sizing:auto;text-wrap:balance;overflow-wrap:anywhere}
h2{font:600 42px/1.12 var(--serif);margin:6px 0 20px;letter-spacing:-.015em;max-width:34ch}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:36px}
.vizcard{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.vizcard>svg{flex:1;min-height:0;width:100%;display:block}
.vizcard>img.fig{flex:1;min-height:0;width:100%;object-fit:contain}
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.tcard{background:var(--surfaceCool);border:1px solid #c8d6df;border-radius:5px;padding:12px 14px 10px}
.tcard h3{margin:0 0 4px;font:700 14px var(--narrow);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tcard svg{width:100%;height:auto;display:block}
.tlabel{font-size:17px;line-height:1.38;margin-top:4px}
.tlabel b{color:var(--train)}
.tlabel.pred b{color:var(--good)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid}
.sw.t{background:var(--trainFill);border-color:var(--train)}
.sw.f{background:var(--frozenFill);border-color:var(--frozen)}
.sw.g{background:var(--goodFill);border-color:var(--good)}
.sw.k{background:transparent;border:2px dashed var(--train)}
ul.pts{margin:0;padding:0;list-style:none;font-size:20px;line-height:1.38}
ul.pts li{position:relative;padding-left:20px;margin-bottom:12px}
ul.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--train)}
.take{margin-top:auto;background:var(--chrome);color:var(--darkText);border-radius:4px;padding:14px 18px;font-size:18.5px;line-height:1.38}
.take b{color:#ffd0cf}
.rq{margin:0;padding:0;list-style:none;font-size:18px;line-height:1.4}
.rq li{display:grid;grid-template-columns:44px 1fr;gap:8px;margin-bottom:10px}
.rq li em{font:700 16px var(--narrow);font-style:normal;color:var(--train);padding-top:2px}
/* photos */
.photos{display:flex;gap:16px;height:196px;flex:none}
.photos.tall{height:330px}
.photos.grid2 .pgroup>div{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.ph.contain{background:transparent}
.ph.contain img{object-fit:contain}
.ph.contain figcaption{display:none}
.photos.fill{flex:1;height:auto;min-height:0}
.pgroup{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.pgroup>div{display:flex;gap:8px;flex:1;min-height:0}
.pgroup h5{margin:0;font:700 14px var(--narrow);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ph{position:relative;margin:0;flex:1;border-radius:10px;overflow:hidden;background:var(--frozenFill);min-width:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:8px;bottom:8px;background:rgba(23,37,51,.9);color:var(--darkText);font-size:14px;padding:3px 8px;border-radius:6px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .miss{display:none}
.ph.missing img{display:none}
.ph.missing .miss{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--frozen);border-radius:10px;color:var(--muted);font-size:14px;text-align:center;padding:8px 8px 38px}
.ph.missing .miss code{font-size:12.5px;word-break:break-all;color:var(--quiet)}
/* raw-photo case layouts */
.ecases{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:18px 26px}
.ecase{display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:auto auto minmax(0,1fr);gap:4px 10px;min-height:0;min-width:0}
.ecase h5{grid-column:1/-1;margin:0 0 2px;font:700 18px var(--sans);color:var(--ink)}
.ecase .hd{font-size:13.5px;font-weight:700;line-height:1.2;align-self:end}
.ecase .hd.n{font-weight:500;color:var(--muted)}
.ecase .hd.ok,.zcase p.ok{color:var(--good)}
.ecase .hd.no,.zcase p.no{color:var(--bad)}
.ecase .col{display:flex;flex-direction:column;gap:5px;min-height:0}
.ecase img,.zcase img{flex:1;min-height:0;width:100%;object-fit:contain;object-position:left center;display:block}
.ecase img.gone,.zcase img.gone{visibility:hidden}
.zcases{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.zcase{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0;justify-content:center}
.zpair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.zpair figure{margin:0;display:flex;flex-direction:column-reverse;gap:4px}
.zpair img{aspect-ratio:1;height:auto;object-fit:cover}
.zpair figcaption{font-size:12.5px;color:var(--muted);line-height:1.2}
.zcase p{margin:0;font-size:15.5px;line-height:1.3}
.zcase p:first-of-type{margin-top:8px}
/* gallery (image-led slides) */
.gallery{flex:1;min-height:0;display:grid;gap:14px 20px;grid-auto-rows:minmax(0,1fr)}
.gcell{display:flex;flex-direction:column;gap:5px;min-height:0;min-width:0}
.gcell h5{margin:0;font:700 14px var(--narrow);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gcell .grow{flex:1;min-height:0;display:flex;gap:6px}
.gcell p{margin:0;font-size:14.5px;line-height:1.3;font-weight:600;color:var(--ink)}
.gcell p.ok{color:var(--good)}
.gcell p.no{color:var(--bad)}
/* html visualisations */
.htmlviz{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;font-size:17px}
table.kt{width:100%;border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums lining-nums}
.kt th{font:700 14px var(--narrow);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 12px;border-bottom:2px solid var(--ink);vertical-align:bottom}
.kt th small{font:400 13px var(--sans);letter-spacing:0;text-transform:none}
.kt td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line)}
.kt th:first-child,.kt td:first-child,.kt.left td{text-align:left}
.kt .hl{background:var(--goodFill);font-weight:700}
.kt tr.g td{font-weight:700;color:var(--good)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kbox{border:1px solid var(--line);border-radius:5px;padding:12px 16px;background:var(--surface)}
.kbox.good{background:var(--goodFill);border-color:var(--good)}
.kbox h5{margin:0 0 6px;font:700 14px var(--narrow);letter-spacing:.08em;text-transform:uppercase}
.kbox ul{margin:0;padding-left:18px;font-size:16px;line-height:1.45}
ul.dw{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.dw li{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:baseline;padding:18px 4px;border-bottom:1px solid var(--line);font-size:20px}
.dw li i{width:14px;height:14px;border-radius:3px;background:var(--train);display:inline-block}
.dw li span{color:var(--muted);font-size:17px}
.qcards{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.qc{border:1px solid var(--line);border-top:4px solid var(--chrome);border-radius:5px;padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.qc em{font:700 16px var(--narrow);font-style:normal;color:var(--train);letter-spacing:.08em}
.qc h4{margin:0;font:600 22px var(--serif)}
.qc .v{font:600 30px/1.1 var(--serif);margin:6px 0 8px;font-variant-numeric:tabular-nums lining-nums}
.qc ul{margin:0;padding-left:18px;font-size:16.5px;line-height:1.45}
.figure-fallback{flex:1;min-height:220px;display:grid;place-content:center;gap:8px;padding:24px;border:2px dashed var(--frozen);border-radius:10px;color:var(--muted);text-align:center;background:var(--surfaceCool)}
.figure-fallback b{color:var(--ink)}
.figure-fallback code{overflow-wrap:anywhere}
noscript .figure-fallback{position:fixed;inset:24px;z-index:30;background:var(--paper);color:var(--muted)}
/* interactive controls */
.ctrl{display:flex;gap:7px;flex-wrap:wrap;flex:none}
.ctrl button{font:inherit;font-size:15px;cursor:pointer;border:1px solid var(--controlLine);background:var(--card);color:var(--ink);border-radius:4px;padding:6px 12px;min-height:36px}
.ctrl button:hover{border-color:var(--train);background:var(--trainFill)}
.ctrl button.on{background:var(--chrome);color:var(--darkText);border-color:var(--chrome)}
.info{flex:none;font-size:17px;line-height:1.38;min-height:50px;padding:10px 14px;background:var(--surface);border-radius:4px}
/* ---------- section divider ---------- */
.sec{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:56px;align-items:center}
.secN{font:600 120px/1 var(--serif);color:var(--infoFill);-webkit-text-stroke:2px var(--chrome);margin-bottom:6px}
.secT{font:600 54px/1.08 var(--serif);margin:4px 0 18px}
.secQ{font-size:22px;line-height:1.42;margin:0 0 14px;max-width:62ch}
.secQ b{color:var(--train)}
.secD{font-size:20px;line-height:1.46;color:var(--muted);margin:0 0 22px;max-width:62ch}
ol.agenda{margin:0;padding:0;list-style:none;counter-reset:ag}
ol.agenda li{counter-increment:ag;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);font-size:18.5px}
ol.agenda li::before{content:counter(ag,decimal-leading-zero);font:700 15px var(--narrow);color:var(--muted);font-variant-numeric:tabular-nums}
ol.agenda li em{font-style:normal;font:600 15px var(--narrow);letter-spacing:.035em;color:var(--train);text-transform:uppercase}
ol.agenda li em.g{color:var(--good)}
.secR{background:var(--surfaceCool);border:1px solid #c8d6df;border-radius:5px;padding:24px 26px}
.secR svg{width:100%;height:auto;display:block}
.secR .tlabel{font-size:19px;margin-top:8px}
.secR .legend{font-size:14px}
/* ---------- title + end ---------- */
.title{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:48px;align-items:center;padding:72px 80px 0 90px;isolation:isolate}
.title::before{content:"";position:absolute;z-index:-1;top:0;left:0;right:0;height:92px;background:var(--chrome)}
.title .k{position:absolute;left:90px;top:34px;font:700 19px var(--narrow);letter-spacing:.1em;text-transform:uppercase;color:#fff}
.title h1{font:600 76px/1.04 var(--serif);margin:16px 0 18px;letter-spacing:-.025em;max-width:14ch}
.title .sub{font-size:28px;line-height:1.32;color:var(--muted);margin:0 0 44px;max-width:52ch}
.title .names{display:grid;grid-template-columns:repeat(2,auto);justify-content:start;gap:6px 40px;font:600 17px var(--narrow);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.title .date{margin-top:30px;font:600 17px var(--narrow);letter-spacing:.1em;color:var(--ink);font-variant-numeric:tabular-nums}
.title .bar{position:absolute;left:0;top:92px;width:22%;height:8px;background:var(--train)}
.title .secR{background:#fff;border-color:#aebbc5}
.endq{flex:1;display:flex;flex-direction:column;justify-content:center}
.endq h1{font:600 96px/1 var(--serif);margin:0 0 40px}
.endq .slideMeta{max-width:1200px;margin:-24px 0 18px}
.tiles{display:block;max-width:1200px;border-top:2px solid var(--ink)}
.tile{display:grid;grid-template-columns:260px 1fr;align-items:baseline;gap:28px;background:transparent!important;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 8px}
.tile:nth-child(1){border-color:var(--line)}
.tile:nth-child(1) .v{color:var(--trainStrong)}
.tile:nth-child(2){border-color:var(--line)}
.tile:nth-child(2) .v{color:var(--good)}
.tile:nth-child(3){border-color:var(--line)}
.tile:nth-child(3) .v{color:var(--info)}
.tile .v{font:600 52px/1.08 var(--serif);font-variant-numeric:tabular-nums lining-nums}
.tile .l{font-size:18px;line-height:1.38;color:var(--muted);margin-top:0}
/* ---------- svg ---------- */
svg text{font-family:var(--sans)}
.lbl{font-size:15px;fill:var(--ink)}
.sm{font-size:13.5px;fill:var(--muted)}
.xs{font-size:12.5px;fill:var(--muted)}
.mx{font-size:14px;font-weight:600;fill:var(--ink)}
.mxs{font-size:12.5px;fill:var(--muted)}
.bold{font-weight:700}
.ttl{font-size:16px;font-weight:700;fill:var(--ink)}
.num{font-size:15px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums lining-nums}
.big{font-size:24px;font-weight:800;fill:var(--ink);font-variant-numeric:tabular-nums lining-nums}
.fz{fill:var(--frozenFill);stroke:var(--frozen);stroke-width:1.5}
.tr{fill:var(--trainFill);stroke:var(--train);stroke-width:2}
.nb{fill:var(--frozenFill);stroke:var(--frozen);stroke-width:1.2}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.part{transition:fill .5s,stroke .5s;fill:var(--frozenFill);stroke:var(--frozen);stroke-width:1.5}
.part.on{fill:var(--trainFill);stroke:var(--train);stroke-width:2}
.addon{transition:opacity .5s;opacity:0}
.addon.on{opacity:1}
.ax{stroke:var(--grid);stroke-width:1}
.flow{stroke:var(--flow);stroke-width:1.5;fill:none}
.lbar{transform-box:fill-box;transform-origin:center bottom;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ringIn{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}
@keyframes aim{0%,25%{transform:translate(0px,0px)}100%{transform:translate(31px,25px)}}
@keyframes swapUp{0%,40%{transform:translateY(0px)}100%{transform:translateY(-44px)}}
@keyframes swapDown{0%,40%{transform:translateY(0px)}100%{transform:translateY(44px)}}
.a{animation:fadeUp .6s ease both;animation-delay:var(--d,0s)}
.fi{animation:fadeIn .7s ease both;animation-delay:var(--d,0s)}
.gx{transform-box:fill-box;transform-origin:left center;animation:growX .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.gy{transform-box:fill-box;transform-origin:center bottom;animation:growY .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease both;animation-delay:var(--d,0s)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards;animation-delay:var(--d,0s)}
.pulse{animation:pulse 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.ring{transform-box:fill-box;transform-origin:center;animation:ringIn .5s ease both,glow 2.4s ease-in-out infinite;animation-delay:var(--d,0s),calc(var(--d,0s) + .6s)}
.aim{animation:aim 2.2s ease-in-out both;animation-delay:var(--d,0s)}
.swapUp{animation:swapUp 1.8s ease-in-out both;animation-delay:var(--d,0s)}
.swapDown{animation:swapDown 1.8s ease-in-out both;animation-delay:var(--d,0s)}
.li-in{animation:fadeUp .5s ease both;animation-delay:var(--d,0s)}
/* click-driven builds: hidden until their step, and their animations start on reveal */
#slide [data-s]:not(.on),#slide [data-only]:not(.on){opacity:0;visibility:hidden}
#slide [data-s]:not(.on),#slide [data-s]:not(.on) *,#slide [data-only]:not(.on),#slide [data-only]:not(.on) *{animation:none!important}
.count small{font-size:13px;opacity:.75;margin-left:8px;letter-spacing:.04em}
/* ---------- presenter controls ---------- */

}

  .vizcard:has(>svg)::after{content:"Scroll diagram horizontally";position:sticky;left:0;bottom:0;align-self:flex-start;background:var(--chrome);color:#fff;padding:5px 9px;font:600 12px var(--narrow);letter-spacing:.04em}
  .vizcard>.ctrl{position:sticky;left:0;z-index:2;width:calc(100vw - 54px);background:var(--paper)}
  .vizcard>svg{flex:none;min-width:680px;min-height:320px}

}
@media (hover:none){#ctl{opacity:1}}

  button:focus-visible{outline:3px solid Highlight}

}

<body>

</main>

</div>

<noscript><div class="figure-fallback"><b>JavaScript is required to run this slide deck.</b><span>Enable JavaScript, then reload the file. The source remains available in report/presentation_storyboard.md.</span></div></noscript>

<script>
/* =====================================================================
   IMAGE SLOTS. Put your files in report/slide-images/ with these names,
   or edit the paths/captions here. Missing files show a labelled slot.
   ===================================================================== */
const IMG = {
  // Challenge slide (Canva slide 2). Pair panels were split from 2100 (1).png, 3076.png and 3763.png into panels/
  lookA:  { src: 'slide-images/4745 (1).png',            cap: 'Class 4745' },
  lookB:  { src: 'slide-images/4746 (1).png',            cap: 'Class 4746' },
  lookC:  { src: 'slide-images/panels/class-2100.jpg',   cap: 'Class 2100' },
  lookD:  { src: 'slide-images/panels/class-2099.jpg',   cap: 'Class 2099' },
  varA:   { src: 'slide-images/panels/class-3076-a.jpg', cap: 'Class 3076' },
  varB:   { src: 'slide-images/panels/class-3076-b.jpg', cap: 'Class 3076' },
  varC:   { src: 'slide-images/panels/class-1533-a.jpg', cap: 'Class 1533' },
  varD:   { src: 'slide-images/panels/class-1533-b.jpg', cap: 'Class 1533' },
  // Resolution slide (Canva slide 7)
  resStrip: { src: 'slide-images/366.png',               cap: 'One image at 224, 280, 336, 384 and 448 px', fit: 'contain' },
  resSmall: { src: 'slide-images/unlabelled.png',        cap: 'Small subject', fit: 'contain' },
  resClut:  { src: 'slide-images/unlabelled (1).png',    cap: 'Subject hidden in vegetation', fit: 'contain' },
  sibA:   { src: 'slide-images/error-5393-holdout.jpg',  cap: 'Holdout · true 5393' },
  sibB:   { src: 'slide-images/error-5395-training.jpg', cap: 'Training · predicted 5395' },
  unA:    { src: 'slide-images/error-9839-holdout.jpg',  cap: 'Holdout · true 9839' },
  unB:    { src: 'slide-images/error-9828-training.jpg', cap: 'Training · predicted 9828' },
  // "What the model still gets wrong" gallery: holdout photo, true-class and predicted-class training photos
  lookH:  { src: 'slide-images/err-lookalike-holdout.jpg',  cap: 'Holdout photo' },
  lookT:  { src: 'slide-images/err-lookalike-true.jpg',     cap: 'True class' },
  lookP:  { src: 'slide-images/err-lookalike-pred.jpg',     cap: 'Predicted (34%)' },
  tinyH:  { src: 'slide-images/err-tiny-holdout.jpg',       cap: 'Holdout photo' },
  tinyT:  { src: 'slide-images/err-tiny-true.jpg',          cap: 'True class' },
  tinyP:  { src: 'slide-images/err-tiny-pred.jpg',          cap: 'Predicted (89%)' },
  outH:   { src: 'slide-images/err-outside-holdout.jpg',    cap: 'Holdout photo' },
  outT:   { src: 'slide-images/err-outside-true.jpg',       cap: 'True class' },
  outP:   { src: 'slide-images/err-outside-pred.jpg',       cap: 'Predicted (19%)' },
  unfH:   { src: 'slide-images/err-unfamiliar-holdout.jpg', cap: 'Holdout photo' },
  unfT:   { src: 'slide-images/err-unfamiliar-true.jpg',    cap: 'True class' },
  unfP:   { src: 'slide-images/err-unfamiliar-pred.jpg',    cap: 'Predicted (14%)' },
  // "Some photos need a closer look": first pass (red box) and second, zoomed pass
  z1a:    { src: 'slide-images/zoom-1-first.jpg',  cap: 'First pass' },
  z1b:    { src: 'slide-images/zoom-1-second.jpg', cap: 'Second pass' },
  z2a:    { src: 'slide-images/zoom-2-first.jpg',  cap: 'First pass' },
  z2b:    { src: 'slide-images/zoom-2-second.jpg', cap: 'Second pass' },
  z3a:    { src: 'slide-images/zoom-3-first.jpg',  cap: 'First pass' },
  z3b:    { src: 'slide-images/zoom-3-second.jpg', cap: 'Second pass' },
  kQ:     { src: 'slide-images/knn-query.jpg',           cap: 'Query' },
  k1:     { src: 'slide-images/knn-neighbour-1.jpg',     cap: 'Neighbour 1' },
  k2:     { src: 'slide-images/knn-neighbour-2.jpg',     cap: 'Neighbour 2' },
  k3:     { src: 'slide-images/knn-neighbour-3.jpg',     cap: 'Neighbour 3' }
};

/* ---------- svg helpers ---------- */
const DEFS = `<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--flow)"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--train)"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--good)"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker>
</defs>`;
const svg = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${DEFS}${inner}</svg>`;
const st = o => { let s = `--d:${o.d || 0}s;`; if (o.fill) s += `fill:${o.fill};`; if (o.stroke) s += `stroke:${o.stroke};`; if (o.sw) s += `stroke-width:${o.sw};`; if (o.op != null) s += `opacity:${o.op};`; if (o.fo != null) s += `fill-opacity:${o.fo};`; if (o.dash) s += `stroke-dasharray:${o.dash};`; return `style="${s}"`; };
const T = (x, y, s, o = {}) => `<text ${o.id ? `id="${o.id}"` : ''} x="${x}" y="${y}" class="${o.c || 'lbl'} ${o.an || ''}" ${o.a ? `text-anchor="${o.a}"` : ''} ${st(o)}>${s}</text>`;
const R = (x, y, w, h, o = {}) => `<rect ${o.id ? `id="${o.id}"` : ''} x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 8}" class="${o.c || ''} ${o.an || ''}" ${st(o)}/>`;
const P = (d, o = {}) => `<path d="${d}" ${o.anim !== false ? 'pathLength="1"' : ''} class="${o.c || 'flow'} ${o.an || ''}" ${o.m ? `marker-end="url(#${o.m})"` : ''} ${st(o)}/>`;
const C = (x, y, r, o = {}) => `<circle ${o.id ? `id="${o.id}"` : ''} cx="${x}" cy="${y}" r="${r}" class="${o.c || ''} ${o.an || ''}" ${st(o)}/>`;
const G = (inner, o = {}) => `<g ${o.id ? `id="${o.id}"` : ''} class="${o.c || ''} ${o.an || ''}" ${st(o)}>${inner}</g>`;
// build steps: stp(n, …) appears on click n and stays; stp(n, …, true) is shown only while on step n
const stp = (n, inner, only) => `<g ${only ? 'data-only' : 'data-s'}="${n}">${inner}</g>`;

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function cl(cx, cy, n, sx, sy, seed) { const r = rng(seed), p = []; for (let i = 0; i < n; i++) { const u = Math.max(r(), 1e-6), v = r(), m = Math.min(Math.sqrt(-2 * Math.log(u)), 2.2); p.push([cx + sx * m * Math.cos(6.2832 * v), cy + sy * m * Math.sin(6.2832 * v)]); } return p; }
const mean = p => [p.reduce((s, q) => s + q[0], 0) / p.length, p.reduce((s, q) => s + q[1], 0) / p.length];
const dots = (p, col, d0 = 0, r = 3.4, step = .012) => p.map((q, i) => `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${r}" class="pop" style="fill:${col};--d:${(d0 + i * step).toFixed(3)}s"/>`).join('');
const star = (x, y, col, d = 0, s = 1) => { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = (i % 2 ? 5 : 11) * s; pts.push((x + rr * Math.cos(a)).toFixed(1) + ',' + (y + rr * Math.sin(a)).toFixed(1)); } return `<polygon points="${pts.join(' ')}" class="pop" style="fill:${col};stroke:var(--card);stroke-width:1.5;--d:${d}s"/>`; };
const ring = (x, y, col, d = 0) => `<circle cx="${x}" cy="${y}" r="8" class="pop" style="fill:var(--card);stroke:${col};stroke-width:3;--d:${d}s"/>`;
const bird = (cx, cy, s = 1, col = 'var(--illustration)', flip = false) => `<g transform="translate(${cx} ${cy}) scale(${flip ? -s : s} ${s})"><ellipse cx="0" cy="0" rx="16" ry="10" fill="${col}"/><circle cx="13" cy="-8" r="6.5" fill="${col}"/><polygon points="19,-9 26,-7 19,-5" fill="var(--beak)"/><circle cx="15" cy="-9.5" r="1.4" fill="var(--card)"/><polygon points="-14,-2 -27,-8 -25,4" fill="${col}"/><line x1="-2" y1="9" x2="-3" y2="15" stroke="${col}" stroke-width="1.6"/><line x1="4" y1="9" x2="5" y2="15" stroke="${col}" stroke-width="1.6"/></g>`;
const strip = (x, y, trainedBlocks, head, d = 0) => { let s = ''; for (let i = 0; i < 12; i++) s += R(x + i * 13, y, 10, 22, { rx: 2, c: trainedBlocks ? 'tr' : 'fz', an: 'pop', d: d + i * .02 }); s += R(x + 160, y, 16, 22, { rx: 3, c: head ? 'tr' : 'fz', an: 'pop', d: d + .26 }); return s; };

let timer = null;
const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
const reducedMotion = () => motionQuery.matches;
const later = (fn, ms) => {
  if (reducedMotion()) { fn(); return null; }
  const id = setTimeout(fn, ms); (window._timeouts = window._timeouts || []).push(id); return id;
};
const every = (fn, ms) => {
  if (reducedMotion()) return null;
  const id = setInterval(fn, ms); (window._intervals = window._intervals || []).push(id); return id;
};

/* =====================================================================
   "WHERE WE TUNE" — mini ViT schematic
   spec: blocks frozen|train|decay|addon|last · head frozen|train|proto
         predict false|analyse|extend · res text · focus [input,blocks,head,predict]
   ===================================================================== */
function vit(sp) {
  const on = f => (sp.focus || []).includes(f);
  let s = '';
  // input image with patch grid
  let g = R(8, 26, 64, 64, { rx: 4, fill: 'var(--photoFill)', stroke: 'var(--photoLine)' }) + `<line x1="12" y1="80" x2="68" y2="75" stroke="var(--earth)" stroke-width="2"/>` + bird(44, 68, .5);
  for (let i = 1; i < 4; i++) g += `<line x1="${8 + i * 16}" y1="26" x2="${8 + i * 16}" y2="90" stroke="var(--card)" stroke-width="1"/><line x1="8" y1="${26 + i * 16}" x2="72" y2="${26 + i * 16}" stroke="var(--card)" stroke-width="1"/>`;
  if (sp.predict === 'extend' && on('input')) g += R(30, 46, 32, 32, { rx: 2, fill: 'none', stroke: 'var(--good)', sw: 2, dash: '4 3', an: 'pop', d: .9 });
  s += G(g, { an: 'pop', d: 0 });
  s += T(40, 108, 'Input', { a: 'middle', c: 'mx' });
  if (sp.res) s += T(40, 123, sp.res, { a: 'middle', c: 'mxs', fill: on('input') ? 'var(--train)' : '' });
  s += P('M76 58 H90', { m: 'ar', anim: false });
  // 12 blocks
  for (let i = 0; i < 12; i++) {
    const x = 96 + i * 14, d = .15 + i * .035, m = sp.blocks;
    if (m === 'train') s += R(x, 26, 11, 64, { rx: 2, c: 'tr', an: 'pop', d });
    else if (m === 'decay') s += R(x, 26, 11, 64, { rx: 2, c: 'tr', an: 'pop', d, fo: (.18 + .82 * Math.pow(.75, 11 - i)).toFixed(2) });
    else if (m === 'last') s += R(x, 26, 11, 64, { rx: 2, c: i === 11 ? 'tr' : 'fz', an: 'pop', d });
    else {
      s += R(x, 26, 11, 64, { rx: 2, c: 'fz', an: 'pop', d });
      if (m === 'addon') s += R(x + 2.5, 64, 6, 22, { rx: 1.5, fill: 'var(--train)', an: 'pop', d: .65 + i * .04 });
    }
  }
  s += T(178, 108, 'Transformer blocks ×12', { a: 'middle', c: 'mx' });
  const bsub = { train: 'all weights trainable', decay: 'LR ×0.75 per block downward', addon: 'frozen + small trained modules', last: 'last block only', frozen: sp.predict ? 'frozen (trained model)' : 'frozen' }[sp.blocks || 'frozen'];
  s += T(178, 123, bsub, { a: 'middle', c: 'mxs', fill: on('blocks') ? 'var(--train)' : '' });
  s += P('M265 58 H279', { m: 'ar', anim: false });
  // head
  s += R(283, 26, 30, 64, { rx: 3, c: sp.head && sp.head !== 'frozen' ? 'tr' : 'fz', an: 'pop', d: .6 });
  if (sp.head === 'proto') s += star(298, 58, 'var(--trainStrong)', .9, .62);
  s += T(298, 108, 'Head', { a: 'middle', c: 'mx' });
  if (sp.head === 'proto') s += T(298, 123, 'prototype init', { a: 'middle', c: 'mxs', fill: on('head') ? 'var(--train)' : '' });
  s += P('M317 58 H331', { m: 'ar', anim: false });
  // output
  const pe = sp.predict === 'extend', pa = sp.predict === 'analyse';
  s += R(335, 34, 78, 48, { rx: 8, fill: pe ? 'var(--goodFill)' : 'var(--card)', stroke: pe || pa ? 'var(--good)' : 'var(--line)', sw: pe || pa ? 2 : 1.2, dash: pa ? '4 3' : null, an: 'pop', d: .75 });
  s += T(374, 62, pe ? 'Prediction+' : 'Prediction', { a: 'middle', c: 'mx', an: 'a', d: .8 });
  s += T(374, 108, 'Output', { a: 'middle', c: 'mx' });
  if (pe) s += T(374, 123, sp.predLabel || 'zoom · kNN', { a: 'middle', c: 'mxs', fill: 'var(--good)' });
  if (pa) s += T(374, 123, 'error analysis', { a: 'middle', c: 'mxs', fill: 'var(--good)' });
  // focus rings = the knob changed on this slide
  const box = { input: [3, 21, 74, 74], blocks: [91, 21, 175, 74], head: [278, 21, 40, 74], predict: [330, 29, 88, 58] };
  (sp.focus || []).forEach((f, i) => { const b = box[f]; s += R(b[0], b[1], b[2], b[3], { rx: 9, fill: 'none', stroke: f === 'predict' ? 'var(--good)' : 'var(--train)', sw: 2.2, dash: '6 4', an: 'ring', d: 1 + i * .15 }); });
  return svg(420, 132, s, 'Vision Transformer schematic highlighting what is tuned');
}
const LEGEND = `<div class="legend"><span><i class="sw t"></i>trained</span><span><i class="sw f"></i>frozen</span><span><i class="sw g"></i>prediction-time</span><span><i class="sw k"></i>changed here</span></div>`;

const SPEC = {
  t1: { blocks: 'train', head: 'train', res: '224–448 px', focus: ['blocks', 'head'] },
  t2: { blocks: 'addon', head: 'train', res: '336–448 px', focus: ['blocks'] },
  t3: { blocks: 'frozen', head: 'frozen', predict: 'extend', res: '448 px', focus: ['predict'] },
  none: { blocks: 'frozen', head: 'frozen' }
};
const CYCLE3 = [
  { spec: SPEC.t1, label: 'Task 1 · <b>every weight</b> trains' },
  { spec: SPEC.t2, label: 'Task 2 · <b>small modules</b> train; backbone frozen' },
  { spec: SPEC.t3, label: 'Task 3 · <b>nothing</b> trains; prediction changes', pred: true }
];

/* ---------- photo row helper ---------- */
const fig = k => {
  const m = IMG[k];

function viewportBox() {

function fit() {
  const v = viewportBox();
  const compact = v.width <= 700 || matchMedia('(pointer:coarse)').matches;
  const controls = compact ? 68 + Math.max(0, parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom')) || 0) : 0;
  const availableHeight = Math.max(160, v.height - controls);
  const s = Math.min(v.width / 1600, availableHeight / 900);
  deck.style.left = (v.width / 2) + 'px';
  deck.style.top = (availableHeight / 2) + 'px';
  deck.style.transform = `translate(-50%,-50%) scale(${s})`;
}

  document.getElementById('src').innerHTML = sc.src ? sc.src : '';
  const label = sc.title ? sc.title : (sc.type === 'title' ? 'Title' : 'Questions');
  notesEl.innerHTML = `<div class="nt">Speaker notes · ${cur + 1}. ${label}</div>${sc.notes || ''}${sc.take && sc.type !== 'section' ? `<div class="take">${sc.take}</div>` : ''}`;
  document.getElementById('slideStatus').textContent = sc.sec === 'app'
    ? `Appendix slide. ${label}`
    : `Slide ${cur + 1} of ${MAIN}. ${label}`;
}

let stepN = 0, stepMax = 0;
function prepSteps(sc) {
  if (!sc.type && !sc.scripted) {
    // default build for unscripted slides: click 1 = the visual, click 2 = bullets + takeaway
    const vc = slideEl.querySelector('.vizcard');
    if (vc) [...vc.children].forEach(c => c.setAttribute('data-s', '1'));
    slideEl.querySelectorAll('.side ul.pts, .side ul.rq, .side .take').forEach(e => e.setAttribute('data-s', vc ? '2' : '1'));
  }
  const dom = [...slideEl.querySelectorAll('[data-s],[data-only]')].map(e => +(e.dataset.s || e.dataset.only));
  stepMax = Math.max(0, sc.nSteps || 0, sc.takeAt || 0, ...(sc.ptsAt || []), ...dom);
  if (sc.scripted) {
    slideEl.querySelectorAll('.side ul.pts > li').forEach(li => li.setAttribute('data-s', String((sc.ptsAt || [])[+li.dataset.pi] ?? stepMax)));
    const tk = slideEl.querySelector('.side .take'); if (tk) tk.setAttribute('data-s', String(sc.takeAt ?? stepMax));
  }
}
function applyStep() {
  const sc = S[cur];
  slideEl.querySelectorAll('[data-s]').forEach(e => e.classList.toggle('on', +e.dataset.s <= stepN));
  slideEl.querySelectorAll('[data-only]').forEach(e => e.classList.toggle('on', +e.dataset.only === stepN));
  if (sc.onStep) sc.onStep(stepN);
  const c = document.getElementById('count');
  const base = sc.sec === 'app' ? 'Appendix' : String(cur + 1).padStart(2, '0') + ' / ' + MAIN;
  c.innerHTML = base + (stepMax ? `<small>${stepN}/${stepMax}</small>` : '');
  document.getElementById('bPrev').disabled = cur === 0 && stepN === 0;
  document.getElementById('bNext').disabled = cur === S.length - 1 && stepN >= stepMax;
}
function advance() { if (stepN < stepMax) { stepN++; applyStep(); } else go(cur + 1); }
function retreat() { if (stepN > 0) { stepN--; applyStep(); } else if (cur > 0) go(cur - 1, true); }

function render(atEnd, keepStep) {
  clearTimers();
  const sc = S[cur];
  deck.classList.toggle('is-title', sc.type === 'title');
  slideEl.innerHTML = build(sc);
  slideEl.classList.remove('enter'); void slideEl.offsetWidth; slideEl.classList.add('enter');
  if (sc.mount) sc.mount();
  mountTracker(sc);
  updateChrome();
  prepSteps(sc);
  stepN = keepStep != null ? Math.min(keepStep, stepMax) : atEnd ? stepMax : 0;
  applyStep();
  requestAnimationFrame(() => {
    if (viewportBox().width <= 900) {
      document.querySelectorAll('.vizcard').forEach(card => {
        if (card.scrollWidth > card.clientWidth) card.scrollLeft = (card.scrollWidth - card.clientWidth) / 2;
      });
    }
  });
}
function go(i, atEnd) { const n = Math.max(0, Math.min(S.length - 1, i)); if (n === cur && slideEl.innerHTML) return; cur = n; render(atEnd); try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {} }

function toggleNotes() {
  const open = notesEl.classList.toggle('open');
  document.getElementById('bNotes').setAttribute('aria-expanded', String(open));
  notesEl.setAttribute('aria-hidden', String(!open));
}
function announce(message) {
  const status = document.getElementById('slideStatus');
  status.textContent = '';
  requestAnimationFrame(() => { status.textContent = message; });
}
async function toggleFull() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {
    announce('Full screen is unavailable in this browser. The presentation remains open in the current window.');
  }
}
document.getElementById('bPrev').onclick = () => retreat();
document.getElementById('bNext').onclick = () => advance();
document.getElementById('bReplay').onclick = () => render(false, stepN);
document.getElementById('bNotes').onclick = toggleNotes;
document.getElementById('bFull').onclick = toggleFull;
document.addEventListener('fullscreenchange', () => {
  document.getElementById('bFull').setAttribute('aria-pressed', String(!!document.fullscreenElement));
  fit();
});
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (k === 'Escape' && notesEl.classList.contains('open')) { e.preventDefault(); toggleNotes(); return; }
  if (e.target.closest && e.target.closest('button, a, input, select, textarea, [contenteditable="true"]')) return;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); advance(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); retreat(); }
  else if (k === 'ArrowDown') { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowUp') { e.preventDefault(); go(cur - 1); }
  else if (k === 'Home') go(0);
  else if (k === 'End') go(MAIN - 1);
  else if (k === 'n' || k === 'N') toggleNotes();
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'r' || k === 'R') render(false, stepN);
});
slideEl.addEventListener('click', e => { if (e.target.closest('button, a, input, select, textarea, .ctrl')) return; advance(); });
const ctl = document.getElementById('ctl'); let hideT;
addEventListener('mousemove', () => { ctl.classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => ctl.classList.remove('show'), 2200); });
ctl.addEventListener('focusin', () => { clearTimeout(hideT); ctl.classList.add('show'); });
ctl.addEventListener('focusout', e => {
  if (!ctl.contains(e.relatedTarget)) hideT = setTimeout(() => ctl.classList.remove('show'), 250);
});
motionQuery.addEventListener('change', () => render(false, stepN));
// #12 opens slide 12; #12.3 opens slide 12 at build step 3 (handy for rehearsing a section)
const hm = (location.hash || '').match(/^#(\d+)(?:\.(\d+))?/);
if (hm && +hm[1] >= 1 && +hm[1] <= S.length) cur = +hm[1] - 1;
render(false, hm && hm[2] != null ? +hm[2] : null);
</script>
</body>
</html>
