data_root: /content/data
model_name: vit_base_patch16_224.augreg2_in21k_ft_in1k
pretrained: true
num_classes: 10000
img_size: 336
batch_size: 4096
grad_accum_steps: 1
epochs: 30
lr: 0.0001
weight_decay: 0.0001
warmup: 9.0
bf16: true
num_workers: 8
seed: 42
output_dir: outputs
label_smoothing: 0.1
method: full_ft
head_type: linear
head_init: random
lr_sweep:
- 0.001
- 0.003
- 0.01
- 0.03
lr_schedule: onecycle
standardise_features: true
holdout_per_class: 5
feature_dir: /content/features
feature_batch_size: 256
