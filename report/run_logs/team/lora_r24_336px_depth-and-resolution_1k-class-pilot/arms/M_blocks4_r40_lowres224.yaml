data_root: /content/data
model_name: vit_base_patch16_224.augreg2_in21k_ft_in1k
pretrained: true
num_classes: 10000
img_size: 336
batch_size: 128
grad_accum_steps: 2
epochs: 3
lr: 0.0003
weight_decay: 0.05
warmup: 0.15
bf16: true
num_workers: 8
seed: 42
output_dir: outputs
label_smoothing: 0.1
method: lora
head_type: cosine
head_init: prototype
lora_targets:
- qkv
- proj
- fc1
- fc2
lora_rank: 40
lora_alpha: 40
lora_dropout: 0.0
unfreeze_extra:
- norm
- bias
- pos_embed
- cls_token
prototype_file: /content/drive/MyDrive/CS604_RUNS/ablation_ablation_lora_depth_res/prototypes_pilot_fit.pt
head_lr: 0.003
clip_grad_norm: 1.0
max_train_minutes: 144
schedule_fit_time: true
first_trainable_block: 4
low_res_size: 224
low_res_fraction: 0.67
