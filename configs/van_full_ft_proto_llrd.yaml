# Van's prototype-initialized full FT with layer-wise lr decay, for the
# 2.4 h budget on a 40 GB A100 (Colab: METHOD = "van_full_ft_proto_llrd").
# Tuned on a laptop on a fixed 5-image/class holdout: 72.98% after 3 epochs,
# 73.97% after 6 (report/progress_log.md, Van, 2026-10-06). Without layer decay
# the same rate scored 6.7 points lower.
# Trains on all 45 images/class. The cosine schedule is fitted to the time
# limit (schedule_fit_time), so the lr reaches zero at 144 training minutes;
# `epochs` is only an upper bound.
inherits: base.yaml
method: full_ft
head_type: cosine
head_init: prototype
prototype_file: /content/drive/MyDrive/CS604_RUNS/prototypes.pt
lr: 4.0e-4            # top block; lower blocks get lr * layer_decay ** depth-from-top
layer_decay: 0.75
head_lr: 4.0e-3
weight_decay: 0.05
label_smoothing: 0.1
drop_path_rate: 0.1
clip_grad_norm: 1.0
batch_size: 256
grad_accum_steps: 1
num_workers: 8
epochs: 30
warmup: 1.5           # epochs: 5% of the 30-epoch ceiling, i.e. about 5% of the time budget
max_train_minutes: 144
schedule_fit_time: true
