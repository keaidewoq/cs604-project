# Train only the cosine head, starting from class prototypes.
data_root: "${CS604_DATA}"
output_dir: "${CS604_OUTPUTS}/prototype-head"
timm_checkpoint: "vit_base_patch16_224.augreg2_in21k_ft_in1k"
num_classes: 10000
image_size: 224
mode: head
head_type: cosine
train_head: true
prototype_file: "${CS604_OUTPUTS}/prototypes/class_prototypes.pt"
batch_size: 64
eval_batch_size: 128
grad_accum: 1
num_workers: 4
epochs: 3
max_steps: null
train_per_class: null
val_per_class: 5
split_seed: 604
validate: true
lr: 0.001
weight_decay: 0.0
label_smoothing: 0.1
precision: bf16
grad_checkpointing: false
log_every: 100
ckpt_every: 1000
seed: 0
synthetic: false
resume: null
