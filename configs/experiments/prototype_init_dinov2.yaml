# Class prototypes for vit_base_patch14_dinov2.lvd142m (DINOv2 ViT-B/14, self-supervised
# on LVD-142M; iNaturalist is not among its curation sources, DINOv2 paper Table 15).
# Same split and images as prototype_init.yaml; only the backbone and the output
# folder differ. image_size 224 resizes its position embeddings from the 518 default
# to a 16x16 grid: same pixels as ViT-B/16 at 224, but 256 patches instead of 196
# (about 30% more compute per image). 85.72M parameters vs 85.80M for ViT-B/16.
# Its own preprocessing (ImageNet mean/std, crop_pct 1.0) applies.
# Compare: augreg_in21k 50.014%.
data_root: "${CS604_DATA}"
timm_checkpoint: "vit_base_patch14_dinov2.lvd142m"
num_classes: 10000
image_size: 224
prototype_per_class: null
val_per_class: 5
split_seed: 604
prototype_output: "${CS604_OUTPUTS}/prototypes_dinov2/class_prototypes.pt"
