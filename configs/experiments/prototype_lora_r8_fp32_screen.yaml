# Rank-8 LoRA screen. Same setup as prototype_lora_r8_screen.yaml, plus the
# validated float32 cosine scores. The frozen head is the existing 40-image
# prototype file; the optimizer sees 10 images/class. This is not a 10-shot study.
# LoRA B starts at zero, so step zero should match the 43.90% baseline.
data_root: "C:/Users/Van Le/cs604-project/cs604-course-data"
