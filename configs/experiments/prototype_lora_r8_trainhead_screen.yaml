# Trained-head screen on the IN1k fine-tune (augreg2_in21k_ft_in1k). Since
# AGENTS.md rule 6 this is the IN1k side of the IN1k-vs-IN21k comparison. Tests
# training the prototype-initialized cosine head together with rank-8 qkv LoRA;
# the head's temperature trains with it. Copy of prototype_lora_r8_fp32_screen.yaml with
# only train_head: true and head_lr added (plus its own output_dir).
# Compare against prototype_lora_r8_fp32_screen: 51.094% (frozen head, same
# 10 images/class, same 50,000-image holdout, same 2 epochs and lr).
# head_lr 0.001: the rate the head-only screen used from these same prototypes
# (43.90% -> 45.86%, stable); 2x the LoRA lr so the temperature can climb from
# 20 toward ~40 within the run, but not far higher, because 10 images/class
# could pull 7.68M head weights away from the 40-image prototypes.
# Step zero is unchanged (LoRA B = 0, head = prototypes), so the 43.90% gate holds.
# Trainable: 0.29M backbone (0.31%, the course number) + 7.68M head.
data_root: "C:/Users/Van Le/cs604-project/cs604-course-data"
output_dir: "C:/Users/Van Le/cs604-project/cs604-outputs/prototype_lora_r8_trainhead_screen"
timm_checkpoint: "vit_base_patch16_224.augreg2_in21k_ft_in1k"
