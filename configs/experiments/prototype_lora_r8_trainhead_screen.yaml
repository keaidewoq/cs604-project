val_per_class: 5
split_seed: 604
validate: true
lr: 0.0005
weight_decay: 0.01
label_smoothing: 0.0
precision: bf16
grad_checkpointing: false
log_every: 100
ckpt_every: 1000
seed: 0
synthetic: false
resume: null
