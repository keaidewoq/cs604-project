# Follow-up to the successful prototype_validate_fp32_head.yaml run.
# Baseline remains a best.pt candidate; preserve full-precision class scoring.
# Optimization uses 5 images/class, but initialization used 40: this is NOT a 5-shot study.
data_root: "${CS604_DATA}"
output_dir: "${CS604_OUTPUTS}/prototype-head-screen"
timm_checkpoint: "vit_base_patch16_224.augreg2_in21k_ft_in1k"
num_classes: 10000
image_size: 224
mode: head
head_type: cosine
cosine_head_fp32: true
train_head: true
init_checkpoint: "${CS604_OUTPUTS}/prototype-validate-fp32-head/best.pt"
evaluate_before_training: true
expected_initial_accuracy: 0.439
initial_accuracy_tolerance: 0.001
expected_initial_samples: 50000
baseline_reference_split: "${CS604_OUTPUTS}/prototypes/splits/internal_val.txt"
train_per_class: 5
val_per_class: 5
split_seed: 604
validate: true
batch_size: 64
eval_batch_size: 128
grad_accum: 1
num_workers: 4
epochs: 1
max_steps: null
lr: 0.001
weight_decay: 0.0
label_smoothing: 0.0
precision: bf16
grad_checkpointing: false
log_every: 100
ckpt_every: 500
seed: 0
synthetic: false
resume: null
