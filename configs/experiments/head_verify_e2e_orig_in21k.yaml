# Verifies the cached-feature head trainer against the real training path.
# mode: head on vit_base_patch16_224.orig_in21k, cosine head from its prototypes,
# temperature trained (course rule 1), 40 images/class with real augmentation,
# 1,000 updates. Compared with sweep point r0_verify_1000 in
# head_sweep_orig_in21k.yaml (same settings, same seed, so the same images in
# every batch; only the augmentation draws differ: cached views versus fresh).
# Expect an identical step-zero score (0.41816) and a close final score.
data_root: "${CS604_DATA}"
output_dir: "${CS604_OUTPUTS}/head_verify_e2e_orig_in21k"
timm_checkpoint: "vit_base_patch16_224.orig_in21k"
num_classes: 10000
image_size: 224
mode: head
head_type: cosine
cosine_head_fp32: true
train_head: true
prototype_file: "${CS604_OUTPUTS}/prototypes_orig_in21k/class_prototypes.pt"
evaluate_before_training: true
expected_initial_accuracy: 0.41816
initial_accuracy_tolerance: 0.001
expected_initial_samples: 50000
baseline_reference_split: "${CS604_OUTPUTS}/prototypes/splits/internal_val.txt"
train_per_class: null
val_per_class: 5
split_seed: 604
validate: true
batch_size: 64
eval_batch_size: 128
grad_accum: 1
num_workers: 16
epochs: 1
max_steps: 1000
lr: 0.001
weight_decay: 0.0
label_smoothing: 0.0
precision: bf16
grad_checkpointing: false
log_every: 100
ckpt_every: 1000
seed: 0
synthetic: false
resume: null
