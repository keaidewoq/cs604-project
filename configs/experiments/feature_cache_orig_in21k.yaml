# Feature cache for head-only training on vit_base_patch16_224.orig_in21k (the
# project document's vit-base-patch16-224-in21k). Not a training run: the frozen
# backbone's pre-logits features, for the cached head sweep
# (head_sweep_orig_in21k.yaml). Run with scripts/cache_features.py.
# The split is recomputed and must match the orig_in21k prototype build byte for
# byte (40 train / 5 holdout per class, split_seed 604). Augmented views use the
# training transform from build_transforms (timm is_training=True), seeded per
# image (see src/cs604/engine/feature_cache.py). The holdout is stored float32 so
# the cached step-zero score can match the 0.41816 gate exactly; train views float16.
data_root: "C:/Users/Van Le/cs604-project/cs604-course-data"
cache_dir: "C:/Users/Van Le/cs604-project/cs604-outputs/feature_cache/orig_in21k"
timm_checkpoint: "vit_base_patch16_224.orig_in21k"
num_classes: 10000
image_size: 224
val_per_class: 5
split_seed: 604
prototype_file: "C:/Users/Van Le/cs604-project/cs604-outputs/prototypes_orig_in21k/class_prototypes.pt"
reference_splits:
  train: "C:/Users/Van Le/cs604-project/cs604-outputs/prototypes_orig_in21k/splits/prototype_train.txt"
  holdout: "C:/Users/Van Le/cs604-project/cs604-outputs/prototypes/splits/internal_val.txt"
batch_size: 256
num_workers: 16
views:
  holdout:        # 50,000 images, eval transform (resize 248, center crop 224)
    split: holdout
    transform: eval
    dtype: float32
    batch_size: 128   # the evaluation batch size of prototype_validate_orig_in21k
  clean:          # 400,000 training images, eval transform
    split: train
    transform: eval
    dtype: float16
  aug_default:    # 10 views, training transform with timm's crop scale [0.08, 1.0]
    split: train
    transform: train
    count: 10
    seed: 1000    # view k uses seed 1000 + k
    dtype: float16
  aug_crop035:    # 10 views, training transform with train_crop_scale [0.35, 1.0]
    split: train
    transform: train
    train_crop_scale: [0.35, 1.0]
    count: 10
    seed: 2000
    dtype: float16
