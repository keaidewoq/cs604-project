# Van's full FT recipe (configs/full_ft_224px_proto-cosine_llrd0.75_top-lr4e-4_2.4h.yaml, CodaBench 0.757 at 224)
# run at 336, to test whether resolution adds on top of it.
# Needs Van's trainer options from `van-dev` (layer_decay, drop_path_rate,
# clip_grad_norm, schedule_fit_time).
#
# Only two things differ from Van's run:
#   img_size 336 (was 224)
#   batch 128 x grad_accum 2 (was 256 x 1): same effective batch of 256, about
#     half the activation memory, since 336 has 2.25x the tokens of 224
#
# 1) Prototypes at 336 (once):
#    python scripts/build_prototypes.py --config configs/full_ft_336px_proto-cosine_llrd0.75_top-lr4e-4_2.4h.yaml \
#        --output /content/drive/MyDrive/CS604_RUNS/prototypes_336.pt
# 2) Launcher with METHOD = "full_ft_336px_proto-cosine_llrd0.75_top-lr4e-4_2.4h" and RUN_PILOT = False, so the
#    launcher does not lower `epochs` (here it is only a ceiling; the time limit
#    ends training and the cosine is fitted to it).
# At about 350-400 img/s expect roughly 7 epochs in 144 min, vs about 16 at 224.
inherits: shared_vit-b16_augreg2_defaults.yaml
method: full_ft
img_size: 336
head_type: cosine
head_init: prototype
prototype_file: /content/drive/MyDrive/CS604_RUNS/prototypes_336.pt
lr: 4.0e-4            # top block; lower blocks get lr * layer_decay ** depth-from-top
layer_decay: 0.75
head_lr: 4.0e-3
weight_decay: 0.05
label_smoothing: 0.1
drop_path_rate: 0.1
clip_grad_norm: 1.0
batch_size: 128
grad_accum_steps: 2   # effective batch 256, as in Van's run
num_workers: 8
epochs: 30            # ceiling only; keep warmup / epochs = 5% as in Van's run
warmup: 1.5
max_train_minutes: 144
schedule_fit_time: true
