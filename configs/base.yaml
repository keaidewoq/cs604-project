# Shared defaults. Method configs inherit this file and override only what differs.
# Swap the backbone here if you want the ImageNet-21k-only checkpoint, e.g.
#   vit_base_patch16_224.augreg_in21k
data_root: /content/data
model_name: vit_base_patch16_224.augreg2_in21k_ft_in1k
pretrained: true
num_classes: 10000
img_size: 224
batch_size: 64
grad_accum_steps: 1
epochs: 3
lr: 1.0e-4
# head_lr: 1.0e-3   # if set, classifier uses this; backbone keeps `lr` (Qian FT)
weight_decay: 0.05
warmup: 1.0          # warmup epochs (can be fractional)
bf16: true
num_workers: 2
seed: 42
output_dir: outputs
label_smoothing: 0.0
method: full_ft
head_type: linear          # linear | cosine (cosine pairs with prototype init)
head_init: random          # random | prototype
# prototype_file: /content/drive/MyDrive/CS604_RUNS/prototypes.pt

