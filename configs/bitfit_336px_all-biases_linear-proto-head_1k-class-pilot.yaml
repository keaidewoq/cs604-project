# Original filename: bitfit_ablation_336.yaml
# Brought onto main from origin/qq_bitfit_ablation for the final report.
# The filename states the config. inherits: paths point at the renamed files.
inherits: base.yaml
method: bitfit
bitfit_scope: all
img_size: 336
head_type: linear
head_init: prototype
evaluate_before_training: false
max_adaptation_pct: 5.0
lr: 1.0e-3
head_lr: 1.0e-3
weight_decay: 0.0
epochs: 3
max_train_minutes: null
warmup: 0.15
batch_size: 64
grad_accum_steps: 1
num_workers: 8
seed: 42
ablation:
  split_seed: 42
  holdout_per_class: 5
  pilot_classes: 1000
  pilot_epochs: 3
  pilot_lrs: [1.0e-4, 3.0e-4, 1.0e-3]
  tie_tolerance: 0.003
