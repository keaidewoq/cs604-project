# AdaptFormer (parallel adapter beside each MLP) at 336, with an lr pilot sweep.
# Select in the launcher with METHOD = "adaptformer_336".
# Adapter params: 12 x 99,136 = 1.19M (~1.4% of backbone; head excluded).
inherits: adaptformer.yaml # method: adaptformer, adapter_dim: 64, adaptformer_scale: 0.1, lr: 1e-3
img_size: 336
adapter_dim: 64
adaptformer_scale: 0.1
lr: 1.0e-3                 # replaced by the pilot's choice in best_config.yaml
epochs: 7                  # upper bound; the launcher lowers it to fit the time budget
warmup: 0.3

pilot:
  num_classes_subset: 1000
  holdout_per_class: 5
  tie_tolerance: 0.003
  sweep:
    lr: [3.0e-4, 1.0e-3, 3.0e-3]
  epochs: 3
  warmup: 0.15
