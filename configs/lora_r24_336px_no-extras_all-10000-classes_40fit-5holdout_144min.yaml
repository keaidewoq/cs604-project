# LoRA r24 without extras (CodaBench 0.784, 4.12%) at full length on ALL 10,000 classes, with
# 5 photos per class held out (50,000 labelled photos the model never trains on; 40 per class
# left for training, 400,000). A full-scale model with a labelled holdout, which the CodaBench
# runs don't have (they train on all 45 photos and val labels are hidden).
#
# Why: the pilots use 1,000-class subsets, and the sibling-dense one (class blocks) scored 6.3
# points lower than the random one. This answers the top-k question on the real class count:
# top-1/2/3/5, where errors sit (rank 2 vs 3-5), how many errors are relatives, and whether
# kNN re-ranking helps (scripts/error_analysis.py, scripts/rerank_knn.py on its holdout).
#
# Training as in the full runs: the base config's 144 training minutes with the cosine fitted to
# them (no pilot epoch override). Prototypes are rebuilt from the 40 fit photos per class, so the
# head never saw the holdout. Holdout evaluation each epoch runs outside the time budget.
# Launcher: notebooks/colab_lora-r24_336px_all-10000-classes_topk-and-knn.ipynb (~4 h; resumes if Colab crashes).
base: lora_r24_336px_qkv-proj-fc_no-extras_proto-cosine_2.4h.yaml       # relative to this file
base_prototypes: /content/drive/MyDrive/CS604_RUNS/prototypes_336.pt
pilot:
  num_classes_subset: 10000             # all classes
  holdout_per_class: 5
  subset_seed: 0
arms:
  A_all_classes_144min: {}
