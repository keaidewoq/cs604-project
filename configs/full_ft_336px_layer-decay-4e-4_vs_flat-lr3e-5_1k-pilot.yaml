# Layer decay + high lr vs one flat low lr, full FT, everything else identical.
# Pilot scale, 9 epochs (about the epoch count of the full 336 run), two seeds per arm.
# Launcher: notebooks/colab_lora-r24_336px_recipe-ablation_1k-pilot.ipynb with SPEC = this file.
#
# Why: Van removed layer decay only at lr 4e-4 (-6.7, her holdout). The 3-epoch
# parameter-selection pilot then had layer decay at 4e-4 tie one flat lr of 3e-5
# (0.8960 vs 0.8956), but those arms also differed in head lr and drop_path. Here
# only `lr` and `layer_decay` differ, and training is three times longer.
#
#   A_llrd   layer decay 0.75, top lr 4e-4 (bottom ~9.5e-6), Van's recipe at 336
#   B_flat   no layer decay, lr 3e-5 for every block (best of the 1e-5 / 3e-5 / 1e-4
#            no-decay sweep on this pilot, 2026-10-06)
# Both: head lr 4e-3, drop_path 0.1, label smoothing 0.1, clip 1.0, batch 128 x 2,
# prototype cosine head from the pilot's fit images, same subset and holdout.
#
# Read final_val_acc: the seed-0/seed-1 gap within an arm is the noise; a gap between
# arms well beyond it (> ~0.4) means one setting is better at this length.
base: full_ft_336px_proto-cosine_llrd0.75_top-lr4e-4_2.4h.yaml             # relative to this file
base_prototypes: /content/drive/MyDrive/CS604_RUNS/prototypes_336.pt
pilot:
  num_classes_subset: 1000
  holdout_per_class: 5
  subset_seed: 0
  epochs: 9
  warmup: 0.45                          # 5% of 9 epochs, as in the full run
  max_train_minutes: null               # epoch-based schedule, so both arms run exactly 9 epochs
  schedule_fit_time: false
arms:
  A_llrd: {}
  B_flat:
    lr: 3.0e-5
    layer_decay: null
  A_llrd_seed1:
    seed: 1
  B_flat_seed1:
    lr: 3.0e-5
    layer_decay: null
    seed: 1
