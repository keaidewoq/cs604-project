# LoRA r16 at 336, with a pilot sweep before the full run.
# Pilot:    python scripts/pilot_sweep.py --config configs/lora_r16_336px_qkv-proj-fc_lr-sweep.yaml
# Full run: python -m src.train --config <pilot folder>/best_config.yaml
#           (or this file directly if you skip the pilot)
# Launcher: notebooks/colab_pilot-sweep_then-full-run.ipynb
inherits: shared_vit-b16_augreg2_defaults.yaml
method: lora
img_size: 336
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.1
lr: 3.0e-4                 # replaced by the pilot's choice in best_config.yaml
epochs: 7                  # ~20 min/epoch on A100 at 336 (371 img/s); check the total fits 144 min
warmup: 0.35               # epochs, ~5% of the run

pilot:
  num_classes_subset: 1000 # all ~45 images of 1,000 classes (~45k images)
  holdout_per_class: 5     # labelled holdout from those classes
  tie_tolerance: 0.003     # within 0.3 point of the best -> take the lower lr
  sweep:
    lr: [1.0e-4, 3.0e-4, 1.0e-3]
  epochs: 3                # pilot-only overrides below; the full run keeps the values above
  warmup: 0.15
