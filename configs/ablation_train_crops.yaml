# How training images are cropped: random crops vs crops aimed at the organism.
# Pilot scale, same subset / holdout / heads as the other ablations; base = LoRA r24
# without extras (CodaBench 0.784, 4.12%), so only the training crop differs.
# Launcher: notebooks/colab_launcher_ana_train_crops.ipynb (runs the three phases below).
#
# Phase 1: python scripts/ablation.py --spec configs/ablation_train_crops.yaml ... --only A_random_crops S25_bigger_crops
# Phase 2: python scripts/find_boxes.py --config configs/lora_r24_336_no_extras.yaml \
#            --data_root <pilot root> --out_dir <CS604_RUNS>/ablation_ablation_train_crops
#          (DDT co-localization on the pilot's fit images only; never the holdout)
# Phase 3: the same ablation command without --only (finished arms are reused)
#
#   A    today's RandomResizedCrop, area 8-100% of the photo (timm default)
#   S25  random crops of at least 25% of the photo: "just bigger" (control for BOX;
#        Van saw no effect from 35% on full FT at 224, 3 epochs)
#   BOX  random crops that must contain the organism box from find_boxes.py: "aimed"
#        (src/data.py, BoxAwareRandomResizedCrop); size and aspect drawn as in A
#
# Read: BOX vs A = does aiming the crops help; BOX vs S25 = aimed vs just bigger.
# find_boxes.py also writes boxes_stats.json (how often A's crops miss the box; whether
# box crops are recognised better than random crops of the same size) and
# boxes_overlay.png (score maps and boxes on 24 training images).
base: lora_r24_336_no_extras.yaml       # relative to this file
base_prototypes: /content/drive/MyDrive/CS604_RUNS/prototypes_336.pt
pilot:
  num_classes_subset: 1000
  holdout_per_class: 5
  subset_seed: 0
  epochs: 3
  warmup: 0.15                          # 5% of 3 epochs, as in the full run
arms:
  A_random_crops: {}
  S25_bigger_crops:
    train_crop_scale: [0.25, 1.0]
  # phase 3 (needs the boxes phase 2 writes)
  BOX_aimed_crops:
    train_box_file: "{out_dir}/boxes.pt"
  # after scripts/box_sweep.py: the boxes rebuilt with the sweep's winner (box_sweep launcher, part 2)
  BOX2_aimed_crops_sweep_winner:
    train_box_file: "{out_dir}/boxes_v2.pt"
