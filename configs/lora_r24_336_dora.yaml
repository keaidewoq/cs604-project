# DoRA version of lora_r24_336_recipe.yaml (CodaBench 0.785): identical except
# lora_dora, so any difference from 0.785 comes from DoRA alone.
# DoRA (Liu et al., ICML 2024): the adapted weight is split into a direction
# (updated by LoRA) and a learned magnitude per output row.
# Trainable backbone: 4.08M / 85.99M = 4.75% (head excluded); +82,944 magnitude params.
# Pilot (configs/ablation_lora_r24.yaml, arm I): +0.12 points vs LoRA (a tie), 22% slower.
# Launcher: notebooks/colab_launcher_ana_dora336.ipynb. Merges like LoRA for inference
# (scripts/latency_merged.py).
inherits: lora_r24_336_recipe.yaml
lora_dora: true
save_resume_state: true   # last.pt also keeps optimizer/schedule state, so a crashed run can resume (src.train --resume)
