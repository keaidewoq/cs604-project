# Original filename: van_full_ft_336_fast.yaml
# Brought onto main from origin/van-448-finals for the final report.
# The filename states the config. inherits: paths point at the renamed files.
# Van's full FT at 336 (the recipe of configs/full_ft_336_llrd.yaml on ana-branch,
# CodaBench 0.807 plain / 0.819 with zoom) with speed-only options, so more
# epochs fit in the 144-minute limit. The training math is unchanged.
#
#   fused_adamw: true    fused CUDA AdamW kernel (same update rule)
#   torch_compile: true  torch.compile on the training forward/backward; the first
#                        steps compile (about a minute), counted as training time
#   num_workers: 12      all 12 CPUs of the Colab A100 runtime load data
#
# Speed check on the A100 40 GB (scripts/van_speed_check.py, 2026-10-15), img/s:
# with 8 workers the loader (507) and the GPU step (475) were both near the limit,
# and together gave 447, matching the 0.807 run (~442, ~8.5 epochs). Compile lifts
# the GPU step to 600 (fused AdamW alone +0.4%), 12 workers lift the loader to 865;
# together 554 (+24%), about 10.5 epochs. Compare epoch_time_s in epoch_log.csv
# with the earlier ~1,018 s per epoch.
#
# Colab: METHOD = "van_full_ft_336_fast", PROTO_PT = f"{DRIVE_OUT}/prototypes_336.pt",
# TTA_CROP = 0.75.
inherits: full_ft_224px_proto-cosine_llrd0.75_top-lr4e-4_2.4h.yaml
img_size: 336
prototype_file: /content/drive/MyDrive/CS604_RUNS/prototypes_336.pt
batch_size: 128
grad_accum_steps: 2   # effective batch 256, as in the 0.807 run (256 x 1: +2%, 38 GB peak)
fused_adamw: true
torch_compile: true
num_workers: 12
