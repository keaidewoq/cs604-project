# Full fine-tuning at 336 with a backbone-LR pilot sweep.
# Pilot:    python scripts/pilot_sweep.py --config configs/full_ft_336px_backbone-lr-sweep_head-lr1e-3.yaml
# Full run: python -m src.train --config <pilot folder>/best_config.yaml
# Launcher: notebooks/colab_pilot-sweep_then-full-run.ipynb (plans epochs to fit the budget)
# Compared with Qian's full_ft_qq.yaml: 336 instead of 224, cosine + short warmup
# instead of no schedule, and the backbone lr chosen by the pilot.
inherits: shared_vit-b16_augreg2_defaults.yaml
method: full_ft
img_size: 336
batch_size: 32
grad_accum_steps: 2        # effective batch 64
lr: 3.0e-5                 # backbone lr; replaced by the pilot's choice in best_config.yaml
head_lr: 1.0e-3            # classifier lr (Qian's two-lr setup)
epochs: 7                  # upper bound; the launcher lowers it to fit the time budget
warmup: 0.3                # epochs, ~5% of the run

pilot:
  num_classes_subset: 1000 # all ~45 images of 1,000 classes (~45k images)
  holdout_per_class: 5
  tie_tolerance: 0.003     # within 0.3 point of the best -> take the lower lr
  sweep:
    lr: [1.0e-5, 3.0e-5, 1.0e-4]
  epochs: 3                # pilot-only overrides; the full run keeps the values above
  warmup: 0.15
