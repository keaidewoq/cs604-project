# Push look-alike relatives apart: CosFace margins on the cosine head (src/losses.py).
# Pilot scale; base = LoRA r24 without extras (CodaBench 0.784, 4.12%), so only the loss differs.
# Launcher: notebooks/colab_launcher_ana_sibling_margin.ipynb
#
# Why: on the class-block subset (relatives present) the recipe scores 0.835 vs 0.898 on random
# classes, and 60% of its errors land within 5 IDs (taxonomy smoothing pilot, 2026-10-25).
# Pulling relatives together (neighbour smoothing) did not help; these arms push them apart.
#
#   A        the recipe (no margin)
#   U10      cosine_margin 0.1: beat every class by 0.1 (Van's CosFace; +0.6 on his AdaptFormer
#            laptop screen, 0.2 lost 0.5); never tested on LoRA
#   S10      sibling_margin 0.1: beat only the classes within 5 IDs by 0.1
#   U10_S10  both: beat relatives by 0.2 and everything else by 0.1
#   S20      sibling_margin 0.2 (stronger, relatives only)
#
# Same subset as configs/ablation_taxonomy_smoothing.yaml (100 blocks of 10 consecutive IDs,
# pilot root c1000_h5_s0_b10), so A should reproduce its 0.835. Read final_val_acc and
# final_val_acc_near5. val_loss is plain cross-entropy (margins apply in training only).
base: lora_r24_336_no_extras.yaml       # relative to this file
base_prototypes: /content/drive/MyDrive/CS604_RUNS/prototypes_336.pt
pilot:
  num_classes_subset: 1000
  holdout_per_class: 5
  subset_seed: 0
  class_block: 10
  epochs: 3
  warmup: 0.15                          # 5% of 3 epochs, as in the full run
arms:
  A_no_margin: {}
  U10_uniform_margin:
    cosine_margin: 0.1
  S10_sibling_margin:
    sibling_margin: 0.1
  U10_S10_uniform_plus_sibling:
    cosine_margin: 0.1
    sibling_margin: 0.1
  S20_stronger_sibling_margin:
    sibling_margin: 0.2
