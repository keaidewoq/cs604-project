# Full-data last-block attention with the upgraded recipe; no pilot selection.
inherits: shared_vit-b16_augreg2_defaults.yaml
method: last_blocks
last_n_blocks: 1
train_scope: attention
max_backbone_trainable_fraction: 0.05  # Strictly below 5%, classifier excluded.
img_size: 448
head_type: cosine
head_init: prototype
cosine_scale: 20.0
prototype_file: /content/drive/MyDrive/CS604_RUNS/prototypes_448.pt
evaluate_before_training: false
lr: 1.0e-4
head_lr: 3.0e-3
weight_decay: 0.05  # Trainer excludes 1D biases and LayerNorm parameters.
label_smoothing: 0.1
clip_grad_norm: 1.0
batch_size: 64
grad_accum_steps: 4  # Effective batch 256 (last/time-limited group may be smaller).
num_workers: 8
bf16: true
seed: 42
epochs: null
max_train_minutes: 144
time_warmup_fraction: 0.05
warmup: 0.0  # Epoch-based warmup is unused in time-only training.
