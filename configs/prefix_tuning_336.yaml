# Final all-data prefix tuning: all 12 blocks, length 50 (all_p50).
inherits: base.yaml
method: prefix
img_size: 336
prefix_length: 50
prefix_placement: all
prefix_init_std: 0.02
max_adaptation_pct: 5.0  # Strictly below 5%, excluding the classifier.
head_type: linear
head_init: prototype
prototype_file: /content/drive/MyDrive/CS604_RUNS/prototypes_336.pt
evaluate_before_training: false
lr: 1.0e-3
head_lr: 1.0e-3
weight_decay: 0.0
batch_size: 64
grad_accum_steps: 1
num_workers: 8
seed: 42
# Train for 144 minutes on all labelled data; no epoch ceiling.
epochs: null
max_train_minutes: 144
time_warmup_fraction: 0.05
warmup: 0.0  # Epoch-based warmup is unused in time-only training.
